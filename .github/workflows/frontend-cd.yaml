name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm test

  deploy:
    name: Build, Push and Deploy Frontend
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure Amazon ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names frontend --region ${{ secrets.AWS_REGION || 'us-east-1' }} || \
          aws ecr create-repository --repository-name frontend --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Build and Tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag "${ECR_REGISTRY}/frontend:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/frontend:latest" \
            starter/frontend

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "${ECR_REGISTRY}/frontend:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/frontend:latest"

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Tag VPC subnets for AWS Load Balancer
        run: |
          VPC_ID=$(aws eks describe-cluster --name ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }} --query 'cluster.resourcesVpcConfig.vpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --region ${{ secrets.AWS_REGION || 'us-east-1' }} --query 'Subnets[*].SubnetId' --output text)
          echo "Tagging subnets in VPC ${VPC_ID}: ${SUBNETS}"
          for s in ${SUBNETS}; do
            aws ec2 create-tags --resources "${s}" --tags Key=kubernetes.io/role/elb,Value=1 Key=kubernetes.io/cluster/${{ secrets.EKS_CLUSTER_NAME || 'cluster' }},Value=shared --region ${{ secrets.AWS_REGION || 'us-east-1' }}
          done

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/frontend/k8s
          kustomize edit set image frontend="${ECR_REGISTRY}/frontend:${IMAGE_TAG}"
          kustomize build | kubectl apply -f -

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/frontend -n default --timeout=180s

      - name: Show service status and endpoints
        run: |
          echo "Waiting for AWS to allocate LoadBalancer hostnames..."
          for i in {1..12}; do
            FRONTEND_HOST=$(kubectl get svc frontend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$FRONTEND_HOST" ]; then
              echo "Frontend URL: http://$FRONTEND_HOST"
              break
            fi
            echo "Still waiting for LoadBalancers... ($i/12)"
            sleep 10
          done
          kubectl get services -n default -o wide
          kubectl get pods -n default -o wide
